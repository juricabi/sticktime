---
name: Emulator on GitHub Pages
# The browser emulator (web/simulator.html, one self-contained file) as the project's site:
# https://juricabi.github.io/sticktime/
# Next to it, sdcard/ (the game's SD card files and manifest.json, tools/sd_manifest.py): the
# emulator's track editor installs or updates the game on a radio's SD card from there.
# And tracks/index.json, the track gallery (tracks/, tools/gallery.py): the emulator lists the
# tracks merged since its page was built from there.
on:
  push:
    branches:
      - main
    paths:
      - 'web/simulator.html'
      - 'sdcard/**'
      - 'tools/sd_manifest.py'
      - 'tracks/**'
      - 'tools/gallery.py'
      - 'docs/social-preview.png'
      - 'docs/icon-180.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy the emulator
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Put the site together
        run: |
          mkdir -p _site
          cp web/simulator.html _site/index.html
          cp docs/social-preview.png _site/social-preview.png
          cp docs/icon-180.png _site/apple-touch-icon.png
          python3 tools/sd_manifest.py _site/sdcard
          python3 tools/gallery.py _site/tracks

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
