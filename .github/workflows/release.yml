---
name: Release
# Publish a release on GitHub with a tag like v1.6 (Releases > Draft a new release): this
# attaches the SD card zip (StickTime-1.6-sdcard.zip, built from sdcard/ at that tag) and,
# when docs/releases/v1.6.md exists, uses it as the title and notes.
# Run by hand (Actions > Release > Run workflow) with a tag that has no release yet, it
# publishes that release itself from the branch it runs on, with docs/releases/<tag>.md as
# the notes. With a tag that has a release, it attaches the zip again and takes the notes
# from the branch it runs on (to correct them after the release).
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.6 (a new one is published from this branch)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Attach the SD card zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish the release (run by hand for a new tag)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # the notes as on this branch, also for a release that exists
          notes="$RUNNER_TEMP/notes.md"
          if [ -f "docs/releases/$TAG.md" ]; then cp "docs/releases/$TAG.md" "$notes"; fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ ! -f "$notes" ]; then
              echo "::error::no release $TAG and no docs/releases/$TAG.md to publish it with"
              exit 1
            fi
            gh release create "$TAG" --target "$GITHUB_SHA" --title "StickTime ${TAG#v}" \
              --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
            git fetch -q --tags
          fi
          git checkout -q "$TAG"

      - name: Build and attach
        run: |
          version=${TAG#v}
          zip=StickTime-$version-sdcard.zip
          (cd sdcard && zip -qr "../$zip" SCRIPTS)
          gh release upload "$TAG" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
          notes="$RUNNER_TEMP/notes.md"
          if [ ! -f "$notes" ]; then notes="docs/releases/$TAG.md"; fi
          if [ -f "$notes" ]; then
            gh release edit "$TAG" --title "StickTime $version" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          fi
