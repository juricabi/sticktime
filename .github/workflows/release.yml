---
name: Release
# Publish a release on GitHub with a tag like v1.5 (Releases > Draft a new release): this
# attaches the SD card zip (StickTime-1.5-sdcard.zip, built from sdcard/ at that tag) and,
# when docs/releases/v1.5.md exists, uses it as the title and notes.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)attach the SD card zip to, e.g. v1.5'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Attach the SD card zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Build and attach
        run: |
          version=${TAG#v}
          zip=StickTime-$version-sdcard.zip
          (cd sdcard && zip -qr "../$zip" SCRIPTS)
          gh release upload "$TAG" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
          if [ -f "docs/releases/$TAG.md" ]; then
            gh release edit "$TAG" --title "StickTime $version" --notes-file "docs/releases/$TAG.md" --repo "$GITHUB_REPOSITORY"
          fi
